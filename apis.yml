apis:
- name: Arbiscan Token API
  description: >
    Block explorer API for querying Hegic (HEGIC) token data on Arbitrum One, including token supply,
    holder information, transfer events, and contract interactions. The HEGIC token contract address on
    Arbitrum is 0x431402e8b9de9aa016c743880e04e517074d8cec.
  image: https://arbiscan.io/favicon.ico
  humanURL: https://arbiscan.io/token/0x431402e8b9de9aa016c743880e04e517074d8cec
  baseURL: https://api.arbiscan.io
  tags:
  - Token
  - ERC-20
  - Arbitrum
  - On-Chain Data
  - Transfer Events
  properties:
  - type: Documentation
    url: https://docs.arbiscan.io
  contact:
  - FN: Arbiscan Support
    url: https://arbiscan.io
- name: Hegic Options Subgraph API
  description: >
    GraphQL API powered by The Graph Protocol for querying Hegic options positions, historical trades,
    liquidity pool states, and protocol events on Ethereum. Enables developers to query open and closed
    option positions, premiums paid, expiry data, and exercise history using GraphQL queries.
  image: https://thegraph.com/favicon.ico
  humanURL: https://thegraph.com/explorer?search=hegic
  baseURL: https://api.thegraph.com
  tags:
  - GraphQL
  - Options Positions
  - Subgraph
  - The Graph
  - Historical Data
  properties:
  - type: Documentation
    url: https://thegraph.com/docs/en/subgraphs/querying/introduction/
  contact:
  - FN: The Graph Foundation
    url: https://thegraph.com
- name: Hegic Smart Contracts (Arbitrum)
  description: >
    Hegic's core options protocol is implemented as smart contracts on Arbitrum One. Developers can interact
    directly with the contracts using standard JSON-RPC calls, including querying option positions, strike
    prices, liquidity pool balances, and hedge contract analytics. Key contracts include the ETH and WBTC
    options pools, Stake and Cover pool, and Chainlink price oracle integrations.
  image: https://hegic.co/favicon.ico
  humanURL: https://github.com/hegic/contracts
  baseURL: https://arb1.arbitrum.io
  tags:
  - Smart Contracts
  - JSON-RPC
  - Options
  - Liquidity Pool
  - Strike Prices
  - Hedge Contracts
  properties:
  - type: Documentation
    url: https://github.com/hegic/contracts
  - type: GettingStarted
    url: https://github.com/jmonteer/hegic-resources
  contact:
  - FN: Hegic Protocol
    url: https://hegic.co
    X-twitter: https://twitter.com/HegicOptions
