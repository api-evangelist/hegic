name: Hegic
description: 'Hegic is an on-chain peer-to-pool options trading protocol deployed
  on Arbitrum, enabling users to trade ETH and WBTC call and put options with AMM
  mechanics. Liquidity providers fund shared pools and earn premiums, while traders
  access non-custodial options with on-chain settlement in USDC. Protocol data including
  option positions, liquidity pool TVL, strike prices, premiums, open interest, and
  hedge contract analytics are queryable via DefiLlama''s public REST API, the Arbiscan
  token API, and community-maintained Graph Protocol subgraphs.

  '
